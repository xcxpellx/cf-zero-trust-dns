name: Build & Attach Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build CloudflareDNS_Setup.exe
        run: |
          pyinstaller --onefile --clean --noconfirm --noupx `
            --name CloudflareDNS_Setup `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module pydoc `
            --exclude-module doctest `
            --exclude-module sqlite3 `
            --exclude-module xmlrpc `
            setup_cf_dns.py

      - name: Upload EXE to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CloudflareDNS_Setup.exe

      - name: Upload Artifact (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareDNS_Setup
          path: dist/CloudflareDNS_Setup.exe
